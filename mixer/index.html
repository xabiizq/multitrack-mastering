<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Microphon Mix 60s</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="console">
    <header class="hero">
      <div><p class="eyebrow">Mezclador local para tres pistas</p><h1>Microphon Mix 60s</h1></div>
      <div id="loadStatus" class="status">Cargando WAV…</div>
    </header>

    <section class="transport panel">
      <button id="playBtn" disabled>Play</button>
      <button id="stopBtn" disabled>Stop</button>
      <span id="timeDisplay">00:00.0 / 00:00.0</span>
      <input id="position" type="range" min="0" max="1000" value="0" disabled>
    </section>

    <section id="channels" class="channels"></section>

    <section class="rack">
      <div class="panel">
        <h2>Tape Echo</h2>
        <label>Cantidad global <input data-setting="effects.echo.wet" type="range" min="0" max="1" step="0.01"></label>
        <label>Tiempo ms <input data-setting="effects.echo.time" type="range" min="80" max="900" step="1"></label>
        <label>Feedback <input data-setting="effects.echo.feedback" type="range" min="0" max="0.75" step="0.01"></label>
        <label>Pérdida de agudos <input data-setting="effects.echo.dark" type="range" min="900" max="7000" step="10"></label>
      </div>
      <div class="panel">
        <h2>Dark Chamber</h2>
        <label>Cantidad global <input data-setting="effects.chamber.wet" type="range" min="0" max="1" step="0.01"></label>
        <label>Duración <input data-setting="effects.chamber.duration" type="range" min="0.4" max="4" step="0.01"></label>
        <label>Tono oscuro <input data-setting="effects.chamber.tone" type="range" min="900" max="8000" step="10"></label>
      </div>
      <div class="panel">
        <h2>Master</h2>
        <label>Nivel master <input data-setting="master.level" type="range" min="-18" max="6" step="0.1"></label>
        <label>Drive cinta <input data-setting="master.drive" type="range" min="1" max="3" step="0.01"></label>
        <label>Anchura estéreo <input data-setting="master.width" type="range" min="0" max="1.6" step="0.01"></label>
        <label>Techo limitador dBFS <input data-setting="master.ceiling" type="range" min="-6" max="-0.1" step="0.1"></label>
        <label class="switch"><input data-setting="master.bypass" type="checkbox"> Bypass master</label>
        <label class="switch"><input data-setting="master.mono" type="checkbox"> Escucha mono</label>
      </div>
    </section>

    <section class="panel actions">
      <button id="renderBtn" disabled>Renderizar WAV</button>
      <button id="saveBtn">Guardar ajustes</button>
      <button id="restoreBtn">Restaurar ajustes</button>
      <button id="defaultsBtn">Valores iniciales</button>
      <progress id="renderProgress" value="0" max="100"></progress>
      <span id="renderStatus">Sin render activo.</span>
      <a id="downloadLink" class="download" download="microphon_mix_60s.wav">Descargar WAV</a>
    </section>
  </main>
  <script src="wav_encoder.js"></script>
  <script src="app.js"></script>
</body>
</html>
